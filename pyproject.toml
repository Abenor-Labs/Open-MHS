[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "open-mhs"
version = "0.1.0"
description = "Open Model Hardware Standard - a vendor-neutral driver specification for AI agents to safely operate physical hardware."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
keywords = ["ai-agents", "robotics", "hardware", "driver-specification", "lab-automation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
    "Topic :: System :: Hardware :: Hardware Drivers",
]
dependencies = [
    "fastapi>=0.110,<1.0",
    "uvicorn[standard]>=0.29,<1.0",
    "pydantic>=2.6,<3.0",
    "jsonschema>=4.21,<5.0",
    "httpx>=0.27,<1.0",
    "pyserial>=3.5,<4.0",
    "mcp>=1.9,<2.0",
    "anyio>=4.5",
]

[project.scripts]
open-mhs = "cli.main:main"
open-mhs-mcp = "mcp_adapter.server:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
    "pytest-asyncio>=0.23,<1.0",
]

[tool.setuptools]
packages = ["server", "drivers", "mcp_adapter", "cli"]
include-package-data = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "strict"
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
