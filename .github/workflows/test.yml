name: Tests

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

# Least privilege: this workflow only ever reads the repository.
permissions:
  contents: read

# A new push to the same branch supersedes the run in flight.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: pytest (py${{ matrix.python-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12"]
        include:
          # The repo is developed on Windows and drivers deal in ports and paths, so one
          # Windows leg guards against path and line-ending assumptions.
          - os: windows-latest
            python-version: "3.12"

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Show resolved environment
        run: pip list

      - name: Confirm pyserial is installed
        # The serial tests skip themselves when pyserial is absent. A green run built on
        # silently skipped hardware tests is worse than a red one.
        run: python -c "import serial; print('pyserial', serial.__version__)"

      - name: Run the test suite
        # -rs prints the reason for every skip, so a new skip is visible in the log rather
        # than hidden inside a dot.
        run: python -m pytest -rs --durations=10

      - name: Confirm the real-pyserial test ran rather than skipping
        # pytest exits 0 on a skip, so the suite alone cannot prove this test executed.
        # `-o addopts=""` clears the `-q` in pyproject: combined with another -q it becomes
        # -qq, which suppresses the very summary line this grep depends on.
        shell: bash
        run: |
          python -m pytest tests/test_serial_transport.py -k loopback -rs -o addopts="" \
            | tee loopback.txt
          grep -qE "[1-9][0-9]* passed" loopback.txt

  lint:
    name: lint and schema
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ruff
        run: python -m ruff check .

      - name: Validate every shipped Capability Tag against the schema
        # The schema is the specification. An example that drifts out of conformance is a
        # broken spec, not a broken example.
        run: |
          python - <<'PY'
          import glob, json, sys
          from jsonschema import Draft202012Validator
          from open_mhs.server.models import CapabilityTag

          schema = json.load(open("schema/capability_schema.json"))
          Draft202012Validator.check_schema(schema)
          validator = Draft202012Validator(schema)

          failed = False
          for path in sorted(glob.glob("examples/**/*.mhs", recursive=True)):
              doc = json.load(open(path))
              errors = sorted(validator.iter_errors(doc), key=lambda e: list(e.absolute_path))
              for error in errors:
                  pointer = "/".join(map(str, error.absolute_path)) or "<root>"
                  print(f"{path}:{pointer}: {error.message}")
                  failed = True
              try:
                  # JSON Schema checks shape; the model additionally enforces the physics
                  # rules it cannot express, such as every actuator having a safety limit.
                  CapabilityTag.model_validate(doc)
              except Exception as exc:
                  print(f"{path}: {exc}")
                  failed = True
              if not errors:
                  print(f"{path}: OK")
          sys.exit(1 if failed else 0)
          PY
